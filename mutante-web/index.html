<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="MUTANTE, casa productora del futuro. Comerciales, cine y medios digitales, de México para el mundo."><meta name="theme-color" content="#000000"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Mutante</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: the one-page site in a 1280px design frame zoomed to the window width (native layout under 820px).
   Brand: pure black or a very light grey, Hueso #F3EEE6, Cinabrio #FF4A1C, Cascada logo, Ancho headlines, Archivo body. */
:root {
  --sec: #FF4A1C; --hueso: #F3EEE6;
  --ease: cubic-bezier(.7, 0, .2, 1);
  --pad: 96px;
  --bg: #000000; --fg: #F3EEE6; --g1: #9F9F9F; --g2: #7C7C7C; --g3: #3E3E3E; --g4: #1C1C1C; --tile: #111111; --hdr: 0, 0, 0;
  color-scheme: dark;
}
html.t-light { --bg: #EEEEEC; --fg: #0D0D0D; --g1: #4F4E4B; --g2: #6B6964; --g3: #BEBDB8; --g4: #D9D8D4; --tile: #DEDDD9; --hdr: 238, 238, 236; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Archivo', system-ui, sans-serif; overflow-x: hidden; transition: background .4s var(--ease); }
:where(button) { font: inherit; }
.stage { width: 100%; overflow-x: clip; }
#pvscale { width: 1280px; }

#pv { position: relative; width: 1280px; background: var(--bg); color: var(--fg); font-family: 'Archivo', system-ui, sans-serif;
  --vh: 800px; --st: 56px; --sn: 48px; --hl: 160px; --wt: 148px; --tw: 76%; --ty: 84%; transition: background .4s var(--ease), color .4s var(--ease); }
#pv a { color: inherit; text-decoration: none; }
#pv a:focus-visible, #pv button:focus-visible { outline: 2px solid var(--sec); outline-offset: 3px; }
.d { font-family: 'Archivo', sans-serif; font-weight: 300; font-variation-settings: 'wdth' 125; text-transform: uppercase; letter-spacing: .01em; line-height: 1.02; margin: 0; }
h2.d { font-size: var(--st); }
.bt { font-size: 16px; line-height: 1.6; color: var(--g1); margin: 0; }
.bt.sm { font-size: 14px; }
.lab { font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--g2); }
.lab b { color: var(--sec); font-weight: 500; }
.ey { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.ey i { width: 8px; height: 8px; background: var(--sec); display: inline-block; }
.sec { padding: 96px var(--pad); position: relative; }

/* wordmark: Cascada, vector outlines, no crossbar */
.wm { display: inline-block; line-height: 0; white-space: nowrap; color: inherit; }
.wm svg { display: block; overflow: visible; fill: currentColor; }
.wm .g { transform: translateX(calc(var(--tx) * 1px)); opacity: var(--op); }
.wm.pre .lt, .wm.pre .m { opacity: 0; }
.wm.in .lt, .wm.in .m { animation: ltv .9s var(--ease) both; animation-delay: calc(var(--n, 0) * .06s); }
@keyframes ltv { from { opacity: 0; transform: translateY(90px); } to { opacity: 1; transform: none; } }
.amb .g { animation: amb 9s steps(1, end) infinite; animation-delay: calc(var(--k) * .07s); }
@keyframes amb { 0%, 90% { opacity: var(--op); } 91% { opacity: calc(var(--op) * .15); } 92% { opacity: var(--op); } 93% { opacity: calc(var(--op) * .3); } 94%, 100% { opacity: var(--op); } }

/* header: sticky translucent bar; the small logo appears once the big one has scrolled away */
.hdr { position: sticky; top: 0; z-index: 40; height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 var(--pad); background: rgba(var(--hdr), .55); color: var(--fg); transition: background .4s var(--ease); }
.hdr .lg { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .45s var(--ease), transform .45s var(--ease); }
.hdr.show .lg { opacity: 1; transform: none; pointer-events: auto; }
.hdr.show { background: rgba(var(--hdr), .94); }
.hdr nav { display: flex; gap: 28px; align-items: center; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.hdr nav a { transition: color .2s; } .hdr nav a:hover { color: var(--sec); }
.hdr sup { font-size: 8px; margin-left: 2px; color: var(--sec); }
.tools { display: flex; gap: 14px; align-items: center; padding-left: 20px; border-left: 1px solid var(--g3); }
.lang { display: flex; gap: 6px; align-items: center; }
.lang button { background: none; border: 0; padding: 2px; color: var(--g1); cursor: pointer; letter-spacing: inherit; font-size: inherit; font-weight: inherit; }
.lang button[aria-pressed="true"] { color: var(--fg); }
.thm { width: 26px; height: 26px; border: 1px solid var(--g3); border-radius: 50%; background: none; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--fg); }
.thm i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.mbtn { display: none; }

/* hero: always dark, it is a photograph */
.hero { position: relative; height: max(620px, var(--vh)); margin-top: -64px; overflow: hidden; color: var(--hueso); background: #000; }
.hero .hbg { position: absolute; inset: -20px; }
.hero .hbg img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; display: block; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
.hero .shade { position: absolute; inset: 0; background: #000; opacity: .3; }
.hg { position: absolute; left: 50%; top: var(--ty); width: var(--tw); transform: translate(-50%, -50%); text-align: center; z-index: 5; }
.hey { position: absolute; right: 0; bottom: 100%; margin-bottom: 22px; white-space: nowrap; }

/* side index */
.idx { position: fixed; left: 32px; top: calc(var(--vh) * .16); z-index: 45; display: flex; gap: 16px; --ix: #fff; color: var(--ix); text-shadow: 0 0 8px rgba(0,0,0,.45); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.idx-t { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.idx-t .lb0 { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; }
.idx-t button { background: none; border: 0; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.idx ul { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 30px; }
.idx .line { position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: var(--ix); opacity: .3; }
.idx .fill { position: absolute; left: 0; top: 0; width: 1px; background: var(--ix); height: 0; }
.idx li button { display: flex; align-items: center; gap: 14px; background: none; border: 0; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; opacity: .5; transition: opacity .3s var(--ease); }
.idx li button:hover, .idx li button[aria-current="true"] { opacity: 1; }
.idx .dot { width: 9px; height: 9px; border: 1px solid var(--ix); border-radius: 50%; flex: none; transition: transform .3s var(--ease), background .3s; }
.idx li button[aria-current="true"] .dot { background: var(--ix); transform: scale(1.35); }
.idx .tx b { font-weight: 500; margin-right: 8px; }
html.t-light .idx { --ix: #0D0D0D; text-shadow: none; }
html.t-light .idx.onhero { --ix: #fff; text-shadow: 0 0 8px rgba(0,0,0,.45); }
.idx .tx { display: none; } .idx:hover .tx, .idx:focus-within .tx, .idx.open .tx { display: inline; }

/* intro: always shown on load, always black */
.ld { position: fixed; inset: 0; z-index: 100; background: #000; color: var(--hueso); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity .8s var(--ease); }
.ld.out { opacity: 0; }
.ldc { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.ldbar { width: 120px; height: 1px; background: #262626; position: relative; overflow: hidden; display: block; }
.ldbar i { position: absolute; inset: 0; background: var(--hueso); transform-origin: 0 0; transform: scaleX(0); animation: ldbar var(--dur) linear forwards; }
@keyframes ldbar { to { transform: scaleX(1); } }
.ldt { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #7C7C7C; opacity: 0; animation: ldt .8s var(--ease) 1.1s forwards; }
@keyframes ldt { to { opacity: 1; } }
.ld .solid { fill-opacity: 0; stroke: rgba(243,238,230,.16); stroke-width: 5; animation: aOn 1.6s cubic-bezier(.3, 0, .2, 1) .25s forwards; }
@keyframes aOn { 0% { fill-opacity: 0; } 12% { fill-opacity: .35; } 18% { fill-opacity: .06; } 30% { fill-opacity: .55; } 37% { fill-opacity: .18; } 62% { fill-opacity: .92; } 100% { fill-opacity: 1; stroke-opacity: 0; } }
.ld svg { animation: aGlow 1.6s cubic-bezier(.3, 0, .2, 1) .25s both; }
@keyframes aGlow { 0% { filter: none; } 12% { filter: drop-shadow(0 0 18px rgba(255,226,196,.35)); } 18% { filter: none; } 30% { filter: drop-shadow(0 0 22px rgba(255,226,196,.4)); } 37% { filter: drop-shadow(0 0 6px rgba(255,226,196,.1)); } 62% { filter: drop-shadow(0 0 30px rgba(255,226,196,.45)); } 100% { filter: drop-shadow(0 0 8px rgba(255,226,196,.16)); } }
.ld .g { opacity: 0; animation: aG .55s var(--ease) forwards; animation-delay: calc(1.55s + (4 - var(--k)) * .09s); }
@keyframes aG { 0% { opacity: 0; } 40% { opacity: calc(var(--op) * 1.8); } 100% { opacity: var(--op); } }
@media (prefers-reduced-motion: reduce) { .ld .solid, .ld .g, .ld svg, .ldbar i, .ldt { animation: none !important; opacity: 1; filter: none; fill-opacity: 1; stroke-opacity: 0; transform: none; } .ld .g { opacity: var(--op); } }

/* scroll animations */
#pv .rv { opacity: 0; transform: translateY(20px); filter: blur(6px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease), background .25s var(--ease), color .25s var(--ease); transition-delay: calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms), 0s, 0s; }
#pv .rv.in { opacity: 1; transform: none; filter: none; }
.lo { opacity: 0; }
.lo.in { animation: loT 1.4s cubic-bezier(.3, 0, .2, 1) calc(var(--i, 0) * 90ms) both; }
@keyframes loT { 0% { opacity: 0; filter: blur(5px); } 14% { opacity: .35; } 20% { opacity: .05; } 34% { opacity: .6; } 42% { opacity: .16; } 68% { opacity: .92; filter: blur(0); } 100% { opacity: 1; filter: none; } }
.pills li.pl { opacity: 0; }
.pills li.pl.in { animation: pillOn 1.3s cubic-bezier(.3, 0, .2, 1) calc(var(--i, 0) * 160ms) both; }
@keyframes pillOn { 0% { opacity: 0; border-color: var(--sec); } 12% { opacity: .45; border-color: var(--sec); box-shadow: 0 0 20px rgba(255,74,28,.35); } 20% { opacity: .08; box-shadow: none; } 36% { opacity: .75; border-color: var(--sec); box-shadow: 0 0 22px rgba(255,74,28,.4); } 46% { opacity: .25; } 70% { opacity: 1; border-color: var(--sec); box-shadow: 0 0 16px rgba(255,74,28,.25); } 100% { opacity: 1; border-color: var(--g3); box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { #pv .rv, .lo, .pills li.pl { opacity: 1; transform: none; filter: none; animation: none !important; transition: none; } }

/* work (home) */
.work { padding: 64px var(--pad) 72px; }
.wrow { display: flex; justify-content: space-between; align-items: center; gap: 40px; }
.shd { display: flex; flex-direction: column; gap: 14px; }
.shd h2.d { max-width: 900px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.pills li { border: 1px solid var(--g3); border-radius: 999px; padding: 9px 16px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.pills li b { color: var(--sec); font-weight: 600; margin-right: 6px; display: inline-block; min-width: 1.6em; font-variant-numeric: tabular-nums; }
.cta { display: inline-flex; align-items: center; gap: 14px; background: var(--sec); color: #000 !important; padding: 18px 24px 18px 26px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; flex: none; transition: background .25s var(--ease); }
.cta span { font-size: 18px; transition: transform .25s var(--ease); }
.cta:hover { background: var(--fg); color: var(--bg) !important; } .cta:hover span { transform: translateX(4px); }
.feat { display: grid; gap: 12px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; overflow: hidden; background: var(--tile); cursor: pointer; display: block; border: 0; padding: 0; text-align: left; color: var(--hueso); width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s var(--ease); }
.tile .cat { position: absolute; top: 14px; left: 14px; background: rgba(0, 0, 0, .72); color: var(--hueso); padding: 5px 8px; font-size: 9px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; z-index: 2; max-width: calc(100% - 28px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .cap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; background: rgba(0, 0, 0, .5); opacity: 0; transition: opacity .45s var(--ease); }
.tile .cap .tm { overflow: hidden; padding-top: .1em; padding-bottom: .06em; }
.tile .cap h3 { font-size: 30px; display: block; transform: translateY(110%); transition: transform .65s var(--ease); }
.tile .cap p { margin: 8px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #BDBDBD; opacity: 0; transform: translateY(8px); transition: opacity .5s var(--ease) .12s, transform .5s var(--ease) .12s; }
.tile .du { position: absolute; top: 14px; right: 14px; font-size: 10px; letter-spacing: .14em; color: var(--hueso); opacity: 0; transition: opacity .4s var(--ease); z-index: 2; font-variant-numeric: tabular-nums; }
.tile:hover img, .tile:focus-visible img { transform: scale(1.045); }
.tile:hover .cap, .tile:focus-visible .cap, .tile:hover .du, .tile:focus-visible .du { opacity: 1; }
.tile:hover .cap h3, .tile:focus-visible .cap h3 { transform: none; }
.tile:hover .cap p, .tile:focus-visible .cap p { opacity: 1; transform: none; }
@media (hover: none) { .tile .cap { opacity: 1; } .tile .cap h3 { transform: none; } .tile .cap p { opacity: 1; transform: none; } .ft.reel .cap { opacity: 0; } }
.ft.reel { height: 300px; } .f2 .ft { height: 180px; }
.ft.reel .play { position: absolute; left: 24px; bottom: 22px; display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; z-index: 2; transition: opacity .3s; }
.ft.reel .play i { width: 38px; height: 38px; background: var(--hueso); display: grid; place-items: center; }
.ft.reel .play i::after { content: ""; border-left: 10px solid #000; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.ft.reel:hover .play { opacity: 0; }

/* how we work: one pinned stage, scroll drives it */
.how { position: relative; height: calc(var(--vh) * 3.4); border-top: 1px solid var(--g4); }
.how-st { position: sticky; top: 64px; height: calc(var(--vh) - 64px); display: flex; flex-direction: column; justify-content: center; gap: 56px; padding: 0 var(--pad); overflow: hidden; }
.how-hd { display: flex; justify-content: space-between; align-items: baseline; }
.how-hd .cnt { font-size: 11px; font-weight: 500; letter-spacing: .16em; color: var(--g2); font-variant-numeric: tabular-nums; }
.how-hd .cnt b { color: var(--fg); font-weight: 500; }
.how-tx { min-height: calc(var(--st) * 2.9 + 90px); max-width: 880px; }
.how-tx h2.d { transition: opacity .5s var(--ease), filter .5s var(--ease); }
.how-tx .bt { margin-top: 22px; max-width: 58ch; transition: opacity .5s var(--ease) .08s, filter .5s var(--ease) .08s; }
.how-tx.swap h2, .how-tx.swap .bt { opacity: 0; filter: blur(8px); transition-duration: .18s; transition-delay: 0s; }
.lanes { width: 100%; height: auto; display: block; overflow: visible; }
.lanes .base { fill: none; stroke: var(--g4); stroke-width: 1; }
.lanes .ink { fill: none; stroke: var(--fg); stroke-width: 1; }
.lanes .nd circle { fill: var(--bg); stroke: var(--g3); stroke-width: 1; transition: fill .6s var(--ease), stroke .6s var(--ease); }
.lanes .nd text { fill: var(--g3); font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; transition: fill .6s var(--ease); }
.lanes .nd.on circle { fill: var(--fg); stroke: var(--fg); }
.lanes .nd.on text { fill: var(--fg); }
.lanes .ico { fill: none; stroke: var(--g3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; transition: stroke .6s var(--ease); }
.lanes .ico.on { stroke: var(--sec); }
@media (prefers-reduced-motion: reduce) { .how-tx h2, .how-tx .bt { transition: none; } }

/* services: index on the left, photo and text on the right */
.sv-h { margin-bottom: 40px; }
.svb { display: flex; gap: 56px; min-height: 520px; }
.svb ul { flex: 1 1 0; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; }
.svb li button { white-space: nowrap; background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: left; color: var(--g3); font-size: var(--sn); display: flex; align-items: baseline; gap: 16px; transition: color .25s var(--ease); }
.svb li button small { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .14em; color: var(--sec); font-variation-settings: normal; }
.svb li button:hover { color: var(--g1); } .svb li button[aria-current="true"] { color: var(--fg); }
.svb .pane { flex: 0 0 440px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.svb .pane .ph { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--tile); }
.svb .pane .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s var(--ease); }
.svb .pane .ph img.on { opacity: 1; }
.svb .pane .tg { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.35; }
.brands { margin-top: 80px; }
.brands .bh { display: flex; justify-content: space-between; margin-bottom: 14px; }
.mq { overflow: hidden; border-top: 1px solid var(--g4); border-bottom: 1px solid var(--g4); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.mq-t { display: flex; width: max-content; animation: mq 45s linear infinite; }
.mq:hover .mq-t { animation-play-state: paused; }
@keyframes mq { to { transform: translateX(-50%); } }
.slot { width: 210px; height: 104px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--g4); font-weight: 500; font-variation-settings: 'wdth' 125; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--g2); }
.slot img { max-width: 120px; max-height: 34px; width: auto; height: auto; opacity: .7; transition: opacity .3s var(--ease); }
.slot:hover img { opacity: 1; }
html.t-light .slot img { filter: invert(1); }
@media (prefers-reduced-motion: reduce) { .mq-t { animation: none; flex-wrap: wrap; width: auto; } .mq-t .dup { display: none; } }

/* Hola footer: the greeting, two big ways to find us, then the logo and the motto */
.ftr { padding: 120px var(--pad) 40px; border-top: 1px solid var(--g4); }
.f-top { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 56px; align-items: end; }
.f-hi { container-type: inline-size; min-width: 0; }
.f-top h2.d { font-size: min(var(--hl), 17cqi); line-height: .9; white-space: nowrap; }
.soc { display: flex; flex-direction: column; }
.soc a { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 22px 0; border-top: 1px solid var(--g3); transition: color .25s var(--ease); }
.soc a:last-child { border-bottom: 1px solid var(--g3); }
.soc a:hover { color: var(--sec); }
.soc svg { width: 44px; height: 44px; fill: currentColor; }
.soc .nm { font-size: 34px; }
.soc .ar { font-size: 26px; transition: transform .25s var(--ease); }
.soc a:hover .ar { transform: translate(4px, -4px); }
.f-bot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 120px; }
.f-bot .bt { color: var(--fg); font-weight: 300; font-variation-settings: 'wdth' 125; font-size: 22px; letter-spacing: -.005em; }

/* work page */
.wk-h { padding: 36px var(--pad) 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; }
.wk-h .bt { max-width: 440px; }
.back { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 10px 16px 10px 12px; border: 1px solid var(--g3); margin-bottom: 26px; transition: border-color .25s var(--ease); }
.back:hover { border-color: var(--fg); }
.wk-h h1.d { font-size: var(--wt); }
.wk-f { position: sticky; top: 64px; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 14px var(--pad); background: rgba(var(--hdr), .97); border-top: 1px solid var(--g4); border-bottom: 1px solid var(--g4); }
.lt2 { display: flex; gap: 18px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.lt2 button { background: none; border: 0; color: var(--g2); letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 6px 0; border-bottom: 1px solid transparent; }
.lt2 button[aria-pressed="true"] { color: var(--fg); border-color: var(--sec); }
