<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutante Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Mono:wght@300;400&family=Hanken+Grotesk:wght@300..700&family=Outfit:wght@100..900&display=swap">
<style>
/* Layout: the one-page site in a 1280px design frame zoomed to the window width, plus a floating control panel on the right.
   Locked: pure black, Hueso #F3EEE6, Cinabrio #FF4A1C, Cascada logo without crossbar, Ancho headlines. Two type families only. Single dark look by choice. */
:root {
  color-scheme: dark;
  --accent: #F3EEE6; --text: #F3EEE6; --sec: #FF4A1C;
  --g1: #9F9F9F; --g2: #7C7C7C; --g3: #3E3E3E; --g4: #1C1C1C;
  --ease: cubic-bezier(.7, 0, .2, 1);
  --pad: 96px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #000; color: var(--text); font-family: 'Archivo', system-ui, sans-serif; overflow-x: hidden; }
:where(button) { font: inherit; }
.stage { width: 100%; overflow-x: clip; }
.stage.phone { width: 390px; max-width: 100%; margin: 0 auto; outline: 1px solid #333; }
body:has(.stage.phone) { background: #111; }
#pvscale { width: 1280px; }

/* ---------- control panel ---------- */
.panel { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 80px); width: min(300px, calc(100vw - 24px)); z-index: 200; background: #0B0B0B; border: 1px solid #262626; overflow-y: auto; padding: 14px 14px 18px; font-size: 11px; color: #EDEDED; transition: transform .45s var(--ease); scrollbar-width: thin; scrollbar-color: #333 transparent; }
.panel.off { display: none; }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -14px -14px 12px; padding: 8px 8px 8px 14px; background: #161616; border-bottom: 1px solid #262626; cursor: grab; position: sticky; top: -14px; z-index: 2; touch-action: none; user-select: none; }
.panel .ph:active { cursor: grabbing; }
.panel .ph b { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
.panel .ph span { display: flex; gap: 4px; }
.panel .ph button { background: #0B0B0B; border: 1px solid #333; color: #EDEDED; padding: 4px 8px; font-size: 11px; cursor: pointer; }
.panel .ph button:hover { border-color: #FF4A1C; }
.panel.dock { position: absolute; left: 0 !important; top: 0 !important; right: 0 !important; width: auto; max-height: none; border-left: 0; border-right: 0; border-top: 0; }
.panel.dock .pbody { columns: 5 200px; column-gap: 28px; }
.panel.dock .pbody > * { break-inside: avoid; }
.panel h3 { margin: 16px 0 8px; font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #8A8A8A; }
.panel h3:first-child { margin-top: 0; }
.panel .note { margin: 4px 0 8px; font-size: 10px; line-height: 1.5; color: #8A8A8A; }
.rw { display: grid; grid-template-columns: 78px minmax(0, 1fr) 46px; gap: 8px; align-items: center; margin-bottom: 4px; }
.rw label { color: #DADADA; }
.rw output { font-size: 10px; color: #8A8A8A; text-align: right; font-variant-numeric: tabular-nums; }
.rw input { width: 100%; accent-color: #FF4A1C; margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.sb { font-size: 11px; color: #EDEDED; background: #141414; border: 1px solid #262626; padding: 6px 8px; cursor: pointer; transition: border-color .18s var(--ease); }
.sb:hover { border-color: #666; }
.sb[aria-pressed="true"] { border-color: #F3EEE6; background: #222; }
.sb:focus-visible, .ptog:focus-visible, .rw input:focus-visible { outline: 2px solid #FF4A1C; outline-offset: 2px; }
.sb.red { border-color: #FF4A1C; color: #FF4A1C; }
.chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: #DADADA; }
.chk input { accent-color: #FF4A1C; }
.ptog { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 210; background: #FF4A1C; color: #000; border: 0; padding: 11px 16px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
.copybox { width: 100%; margin-top: 8px; min-height: 90px; font: inherit; font-size: 10px; color: #EDEDED; background: #000; border: 1px solid #262626; padding: 8px; resize: vertical; }

/* ---------- site ---------- */
#pv { position: relative; width: 1280px; background: #000; color: var(--text); font-family: var(--b-font), system-ui, sans-serif; font-weight: var(--b-w, 400);
  --h2: 78px; --b-size: 16px; --b-tr: 0em; --b-lh: 1.6; --hdr-op: .55; --vh: 800px; --ix: 32px; --iy: 16; --hx: 50%; --hy: 84%; --eg: 22px; --es: 11px; --hw: 76%; }
#pv[data-b="archivo"] { --b-font: 'Archivo'; --b-w: 400; }
#pv[data-b="hanken"] { --b-font: 'Hanken Grotesk'; --b-w: 400; }
#pv[data-b="outfit"] { --b-font: 'Outfit'; --b-w: 300; }
#pv[data-b="mono"] { --b-font: 'DM Mono'; --b-w: 300; }
#pv a { color: inherit; text-decoration: none; }
#pv a:focus-visible, #pv button:focus-visible { outline: 2px solid var(--sec); outline-offset: 3px; }
.d { font-family: 'Archivo', sans-serif; font-weight: 300; font-variation-settings: 'wdth' 125; text-transform: uppercase; letter-spacing: .01em; line-height: 1.02; margin: 0; }
h2.d { font-size: var(--h2); }
.bt { font-size: var(--b-size); letter-spacing: var(--b-tr); line-height: var(--b-lh); color: var(--g1); margin: 0; }
.bt.sm { font-size: calc(var(--b-size) * .84); }
#pv.xh .bt { font-size-adjust: ex-height .52; }
.lab { font-size: var(--ls, 11px); font-weight: 500; letter-spacing: var(--lt, .16em); text-transform: uppercase; color: var(--g2); }
.lab b { color: var(--sec); font-weight: 500; }
.ey { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.ey i { width: 8px; height: 8px; background: var(--sec); display: inline-block; }
.sec { padding: 96px var(--pad); position: relative; }

/* wordmark: Cascada, drawn as vector outlines (no font needed), no crossbar */
.wm { display: inline-block; line-height: 0; white-space: nowrap; color: inherit; }
.wm svg { display: block; overflow: visible; fill: currentColor; }
.wm .g { transform: translateX(calc(var(--tx) * 1px)); opacity: var(--op); }
.wm.pre .lt, .wm.pre .m { opacity: 0; }
.wm.in .lt, .wm.in .m { animation: ltv .9s var(--ease) both; animation-delay: calc(var(--n, 0) * .06s); }
@keyframes ltv { from { opacity: 0; transform: translateY(90px); } to { opacity: 1; transform: none; } }
.amb-a .g { animation: ambA 9s steps(1, end) infinite; animation-delay: calc(var(--k) * .07s); }
@keyframes ambA { 0%, 90% { opacity: var(--op); } 91% { opacity: calc(var(--op) * .15); } 92% { opacity: var(--op); } 93% { opacity: calc(var(--op) * .3); } 94%, 100% { opacity: var(--op); } }

/* header: sticky bar, small logo appears once the big one has scrolled away */
.hdr { position: sticky; top: 0; z-index: 40; height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 var(--pad); background: rgba(0, 0, 0, var(--hdr-op)); }
.hdr .lg { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .45s var(--ease), transform .45s var(--ease); }
.hdr.show .lg { opacity: 1; transform: none; pointer-events: auto; }
.hdr nav { display: flex; gap: 28px; align-items: center; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.hdr nav a { transition: color .2s; } .hdr nav a:hover { color: var(--sec); }
.hdr sup { font-size: 8px; margin-left: 2px; color: var(--sec); }
.hdr .lang { display: flex; gap: 6px; align-items: center; padding-left: 20px; border-left: 1px solid #555; }
.hdr .lang button { background: none; border: 0; padding: 2px; color: var(--g1); cursor: pointer; letter-spacing: inherit; }
.hdr .lang button[aria-pressed="true"] { color: var(--text); }

/* hero */
.hero { position: relative; height: max(620px, var(--vh)); margin-top: -64px; overflow: hidden; }
.hero .hbg { position: absolute; inset: -20px; }
.hero .hbg img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; display: block; transition: transform .6s cubic-bezier(.2, .7, .2, 1); }
.hero .shade { position: absolute; inset: 0; background: #000; opacity: .3; }
.hg { position: absolute; left: 50%; top: var(--hy); width: var(--hw); transform: translate(-50%, -50%); text-align: center; z-index: 5; }
.hey { position: absolute; right: 0; bottom: 100%; margin-bottom: var(--eg); font-size: var(--es); white-space: nowrap; }

/* side index: fixed, sits over everything with difference blend */
.idx { position: fixed; left: var(--ix); top: calc(var(--vh) * var(--iy) / 100); z-index: 45; display: flex; gap: 16px; color: #fff; mix-blend-mode: difference; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
.idx-t { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.idx-t .lb0 { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; }
.idx-t button { background: none; border: 0; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.idx ul { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 30px; }
.idx .line { position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: rgba(255, 255, 255, .3); }
.idx .fill { position: absolute; left: 0; top: 0; width: 1px; background: #fff; height: 0; }
.idx li button { display: flex; align-items: center; gap: 14px; background: none; border: 0; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; opacity: .5; transition: opacity .3s var(--ease); }
.idx li button:hover, .idx li button[aria-current="true"] { opacity: 1; }
.idx .dot { width: 9px; height: 9px; border: 1px solid #fff; border-radius: 50%; flex: none; transition: transform .3s var(--ease), background .3s; }
.idx li button[aria-current="true"] .dot { background: #fff; transform: scale(1.35); }
.idx .tx b { font-weight: 500; margin-right: 8px; }
.idx .tx { display: none; } .idx:hover .tx, .idx:focus-within .tx, .idx.open .tx { display: inline; }

/* intro overlay: fixed over the whole window */
.ld { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity .8s var(--ease); }
.ld.out { opacity: 0; }
.ldc { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.ldbar { width: 120px; height: 1px; background: #262626; position: relative; overflow: hidden; display: block; }
.ldbar i { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 0; transform: scaleX(0); animation: ldbar var(--dur) linear forwards; }
@keyframes ldbar { to { transform: scaleX(1); } }
.ldt { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--g2); opacity: 0; animation: ldt .8s var(--ease) 1.1s forwards; }
@keyframes ldt { to { opacity: 1; } }
/* A: light on, a warm filament that catches, then the echoes ignite right to left */
.ld.a .solid { fill-opacity: 0; stroke: rgba(243,238,230,.16); stroke-width: 5; animation: aOn 1.6s cubic-bezier(.3, 0, .2, 1) .25s forwards; }
@keyframes aOn { 0% { fill-opacity: 0; } 12% { fill-opacity: .35; } 18% { fill-opacity: .06; } 30% { fill-opacity: .55; } 37% { fill-opacity: .18; } 62% { fill-opacity: .92; } 100% { fill-opacity: 1; stroke-opacity: 0; } }
.ld.a svg { animation: aGlow 1.6s cubic-bezier(.3, 0, .2, 1) .25s both; }
@keyframes aGlow { 0% { filter: none; } 12% { filter: drop-shadow(0 0 18px rgba(255,226,196,.35)); } 18% { filter: none; } 30% { filter: drop-shadow(0 0 22px rgba(255,226,196,.4)); } 37% { filter: drop-shadow(0 0 6px rgba(255,226,196,.1)); } 62% { filter: drop-shadow(0 0 30px rgba(255,226,196,.45)); } 100% { filter: drop-shadow(0 0 8px rgba(255,226,196,.16)); } }
.ld.a .g { opacity: 0; animation: aG .55s var(--ease) forwards; animation-delay: calc(1.55s + (4 - var(--k)) * .09s); }
@keyframes aG { 0% { opacity: 0; } 40% { opacity: calc(var(--op) * 1.8); } 100% { opacity: var(--op); } }
/* B: focus pull, the mark racks into focus, echoes follow, one soft exposure flash */
.ld.b svg { opacity: 0; filter: blur(14px); animation: bF 1.4s var(--ease) .2s forwards; }
@keyframes bF { to { opacity: 1; filter: blur(0); } }
.ld.b .g { opacity: 0; animation: bG .7s var(--ease) forwards; animation-delay: calc(1.2s + (4 - var(--k)) * .1s); }
@keyframes bG { to { opacity: var(--op); } }
.ld.b::after { content: ""; position: absolute; inset: 0; background: #F3EEE6; opacity: 0; pointer-events: none; animation: flash .6s ease-out 2.05s; }
@keyframes flash { 0% { opacity: 0; } 20% { opacity: .07; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ld .solid, .ld .g, .ld svg, .ldbar i, .ldt, .ld::after { animation: none !important; opacity: 1; filter: none; fill-opacity: 1; stroke-opacity: 0; } .ld .g { opacity: var(--op); } }

/* work (home) */
.work { padding: 64px var(--pad) 72px; }
.wrow { display: flex; justify-content: space-between; align-items: center; gap: 40px; }
.shd { display: flex; flex-direction: column; gap: 14px; }
.shd h2.d { font-size: var(--st); max-width: 900px; }
.f-top .bt { margin-top: 18px; }
.wk-h .bt { max-width: 440px; }
/* scroll animations: things light up and settle as they enter the screen */
#pv .rv { opacity: 0; transform: translateY(20px); filter: blur(6px); transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease), background .25s var(--ease), color .25s var(--ease); transition-delay: calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms), calc(var(--i, 0) * 90ms), 0s, 0s; }
#pv .rv.in { opacity: 1; transform: none; filter: none; }
.lo { opacity: 0; }
.lo.in { animation: loT 1.4s cubic-bezier(.3, 0, .2, 1) calc(var(--i, 0) * 90ms) both; }
@keyframes loT { 0% { opacity: 0; filter: blur(5px); } 14% { opacity: .35; } 20% { opacity: .05; } 34% { opacity: .6; text-shadow: 0 0 .3em rgba(255,226,196,.3); } 42% { opacity: .16; text-shadow: none; } 68% { opacity: .92; filter: blur(0); text-shadow: 0 0 .4em rgba(255,226,196,.35); } 100% { opacity: 1; filter: none; text-shadow: none; } }
.pills li.pl { opacity: 0; }
.pills li.pl.in { animation: pillOn 1.3s cubic-bezier(.3, 0, .2, 1) calc(var(--i, 0) * 160ms) both; }
@keyframes pillOn { 0% { opacity: 0; border-color: var(--sec); } 12% { opacity: .45; border-color: var(--sec); box-shadow: 0 0 20px rgba(255,74,28,.35); } 20% { opacity: .08; box-shadow: none; } 36% { opacity: .75; border-color: var(--sec); box-shadow: 0 0 22px rgba(255,74,28,.4); } 46% { opacity: .25; } 70% { opacity: 1; border-color: var(--sec); box-shadow: 0 0 16px rgba(255,74,28,.25); } 100% { opacity: 1; border-color: var(--g3); box-shadow: none; } }
.pills li b.cn { display: inline-block; min-width: 1.6em; font-variant-numeric: tabular-nums; }
#pv.noanim .rv, #pv.noanim .lo, #pv.noanim .pills li.pl { opacity: 1; transform: none; filter: none; animation: none; transition: none; }
@media (prefers-reduced-motion: reduce) { #pv .rv, .lo, .pills li.pl { opacity: 1; transform: none; filter: none; animation: none !important; transition: none; } }
.stut { position: relative; font-size: calc(var(--h2) * .82); }
.stut span { display: block; }
.stut .e1, .stut .e2 { position: absolute; inset: 0; color: transparent; }
.stut .e1 { transform: translateX(-.09em); -webkit-text-stroke: 1px var(--g2); }
.stut .e2 { transform: translateX(-.045em); -webkit-text-stroke: 1px var(--sec); }
.stut .s0 { position: relative; }
.wa .wrow { margin: 22px 0 28px; }
.wb .wrow.top { margin-bottom: 18px; }
.wb .wrow.mid { margin-bottom: 28px; align-items: flex-start; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.pills li { border: 1px solid var(--g3); border-radius: 999px; padding: 9px 16px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.pills li b { color: var(--sec); font-weight: 600; margin-right: 6px; }
.cta { display: inline-flex; align-items: center; gap: 14px; background: var(--sec); color: #000 !important; padding: 18px 24px 18px 26px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; flex: none; transition: background .25s var(--ease); }
.cta span { font-size: 18px; transition: transform .25s var(--ease); }
.cta:hover { background: var(--accent); } .cta:hover span { transform: translateX(4px); }
.feat { display: grid; gap: 12px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; overflow: hidden; background: #111; cursor: pointer; display: block; border: 0; padding: 0; text-align: left; color: var(--text); width: 100%; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s var(--ease); }
.tile .cat { position: absolute; top: 14px; left: 14px; background: rgba(0, 0, 0, .7); padding: 5px 8px; font-size: 9px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; z-index: 2; }
.tile .cap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; background: rgba(0, 0, 0, .48); opacity: 0; transition: opacity .45s var(--ease); }
.tile .cap .tm { overflow: hidden; padding-top: .1em; padding-bottom: .06em; }
.tile .cap h3 { font-size: 34px; display: block; transform: translateY(110%); transition: transform .65s var(--ease); }
.tile .cap p { margin: 8px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--g1); opacity: 0; transform: translateY(8px); transition: opacity .5s var(--ease) .12s, transform .5s var(--ease) .12s; }
.tile:hover img, .tile:focus-visible img { transform: scale(1.045); }
.tile:hover .cap, .tile:focus-visible .cap { opacity: 1; }
.tile:hover .cap h3, .tile:focus-visible .cap h3 { transform: none; }
.tile:hover .cap p, .tile:focus-visible .cap p { opacity: 1; transform: none; }
@media (hover: none) { .tile .cap { opacity: 1; } .tile .cap h3 { transform: none; } .tile .cap p { opacity: 1; transform: none; } }
@media (hover: none) { .ft.reel .cap { opacity: 0; } }
.ft.reel { height: 300px; } .f2 .ft { height: 180px; }
.ft.reel .play { position: absolute; left: 24px; bottom: 22px; display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; z-index: 2; transition: opacity .3s; }
.ft.reel .play i { width: 38px; height: 38px; background: var(--accent); display: grid; place-items: center; }
.ft.reel .play i::after { content: ""; border-left: 10px solid #000; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.ft.reel:hover .play { opacity: 0; }

/* how we work: one pinned stage. The statement changes per step, the lanes draw themselves as you scroll. */
.how { position: relative; height: calc(var(--vh) * 3.4); border-top: 1px solid var(--g4); }
.how-st { position: sticky; top: 64px; height: calc(var(--vh) - 64px); display: flex; flex-direction: column; justify-content: center; gap: 56px; padding: 0 var(--pad); overflow: hidden; }
.how-hd { display: flex; justify-content: space-between; align-items: baseline; }
.how-hd .cnt { font-size: 11px; font-weight: 500; letter-spacing: .16em; color: var(--g2); font-variant-numeric: tabular-nums; }
.how-hd .cnt b { color: var(--text); font-weight: 500; }
.how-tx { min-height: calc(var(--st) * 2.9 + 90px); max-width: 880px; }
.how-tx h2.d { font-size: var(--st); transition: opacity .5s var(--ease), filter .5s var(--ease); }
.how-tx .bt { margin-top: 22px; max-width: 58ch; transition: opacity .5s var(--ease) .08s, filter .5s var(--ease) .08s; }
.how-tx.swap h2, .how-tx.swap .bt { opacity: 0; filter: blur(8px); transition-duration: .18s; transition-delay: 0s; }
.lanes { width: 100%; height: auto; display: block; overflow: visible; }
.lanes .base { fill: none; stroke: var(--g4); stroke-width: 1; }
.lanes .ink { fill: none; stroke: var(--text); stroke-width: 1; }
.lanes .nd circle { fill: #000; stroke: var(--g3); stroke-width: 1; transition: fill .6s var(--ease), stroke .6s var(--ease), filter .6s var(--ease); }
.lanes .nd text { fill: var(--g3); font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; transition: fill .6s var(--ease); }
.lanes .nd.on circle { fill: var(--text); stroke: var(--text); filter: drop-shadow(0 0 6px rgba(255,226,196,.45)); }
.lanes .nd.on text { fill: var(--text); }
.lanes .ico { fill: none; stroke: var(--g3); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; transition: stroke .6s var(--ease); }
.lanes .ico.on { stroke: var(--sec); }
@media (prefers-reduced-motion: reduce) { .how-tx h2, .how-tx .bt { transition: none; } }

/* services */
.sv-h { margin-bottom: 40px; }
.sva .row { display: grid; grid-template-columns: 56px minmax(0, 7fr) minmax(0, 5fr); column-gap: 24px; padding: 28px 24px 32px; margin: 0 -24px; border-top: 1px solid #2a2a2a; transition: background .25s var(--ease), color .25s var(--ease); }
.sva .row:last-child { border-bottom: 1px solid #2a2a2a; }

    (function f(now) { var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3); c.textContent = pf + Math.round(n * e) + sf; if (p < 1) requestAnimationFrame(f); })(t0);

var KEYS = ['an', 'ls', 'lt', 'st', 'sn', 'hl', 'wt', 'vw', 'ix', 'iy', 'hy', 'hw', 'eg', 'es', 'ho', 'h2', 'bs', 'bt', 'bl', 'bf', 'xh', 'wk', 'dg', 'in', 'sv', 'lg'];
